[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: serve index.html for any unknown path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline security headers for the public web deployment.
# (These apply to the Netlify site only — the Capacitor/Android build bundles
# `dist` and is unaffected.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# Never cache the service worker (so updates roll out promptly).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
